name: Build and publish image

# Builds the container here rather than on the NAS.
#
# A DS720+ ships with 2 GB of RAM and the Swift compiler wants more than that; a build on
# the NAS would either swap for half an hour or be killed by the OOM reaper. GitHub's
# runners have 16 GB and finish in a few minutes, and they are x86_64 — the same
# architecture as the DS720+'s Celeron — so the image runs unchanged.
#
# The route pool is ingested during the build (see Dockerfile), so re-running this
# workflow is also how route data gets refreshed.

on:
  push:
    branches: [main]
  # Manual runs refresh the route data without needing a code change.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache across runs — dependency resolution and the Swift build are the
          # slow parts and neither changes on a data-only refresh.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image serves
        run: |
          # Take the tag metadata-action produced rather than rebuilding the name here.
          # `github.repository` keeps the repo's original capitalisation and Docker
          # rejects an uppercase image name — metadata-action lowercases it for us.
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          echo "smoke testing $IMAGE"
          docker run -d --name smoke -e HOST=0.0.0.0 -p 8080:8080 "$IMAGE"
          for i in $(seq 1 30); do
            sleep 1
            if curl -sf localhost:8080/v1/health > /tmp/health.json; then break; fi
          done
          # Print the container's own output before asserting anything. Without this a
          # container that dies at exec — a missing shared library, say — fails the job
          # with nothing but a non-zero exit status to go on.
          docker logs smoke
          test -s /tmp/health.json || { echo "service never answered"; exit 1; }
          cat /tmp/health.json
          # A container that starts but holds no routes is a failed build, not a warning:
          # it would deploy cleanly and answer nothing.
          test "$(jq -r .status /tmp/health.json)" = "ok"
          test "$(jq -r .routeCount /tmp/health.json)" -gt 0
          docker rm -f smoke
